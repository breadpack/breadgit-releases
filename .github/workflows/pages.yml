name: Publish verified distribution site
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  schedule:
    - cron: '29 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4; pins upload-artifact v4.6.2
        with:
          path: docs
      - name: Allow finalized artifact metadata to become visible
        run: sleep 15
      - name: Deploy complete static tree
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5, Node 24
        with:
          timeout: 180000
          error_count: 3
      - name: Back off before retrying a transient Pages or OIDC failure
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Retry transient Pages or OIDC failure
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5, Node 24
        with:
          timeout: 180000
          error_count: 3

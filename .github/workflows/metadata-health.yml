name: Metadata health
on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install public verification dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-cryptography
      - name: Check real HTTPS signatures, renewal heartbeat and expiry
        run: /usr/bin/python3 operations/monitor.py --roots operations/roots.json
      - name: Record failure
        if: failure()
        run: echo 'BreadGit metadata renewal failed or metadata freshness could not be verified. Inspect updates/renewal-status.json and the private renewal service. No signing keys are used in this workflow.' >> "$GITHUB_STEP_SUMMARY"
